[project]
name = "jval"
version = "0.1.0"
description = "Judge validation harness for LLM evaluation"
requires-python = ">=3.9"
dependencies = ["groq>=0.11"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
